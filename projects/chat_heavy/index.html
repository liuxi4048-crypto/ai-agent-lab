<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>マリオ風横スクロールアクションゲーム</title>
<style>
    body{margin:0;background:#5c94fc;font-family:sans-serif;}
    #gameCanvas{background:#8bd4ff;display:block;margin:0 auto;}
    #ui{
        position:absolute;top:10px;left:50%;transform:translateX(-50%);
        color:#fff;background:rgba(0,0,0,0.5);padding:5px 10px;
        border-radius:5px;font-size:14px;
        pointer-events:none;
    }
</style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="400"></canvas>
<div id="ui"></div>

<script>
/* -------------------------------------------------------------
   シンプルな横スクロールゲーム（マリオ風） - 純粋JS実装
------------------------------------------------------------- */

(() => {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const ui = document.getElementById('ui');

    // ------- 定数 -------
    const GRAVITY = 0.5;
    const FRICTION = 0.8;
    const PLAYER_SPEED = 4;
    const JUMP_STRENGTH = 12;
    const CANVAS_W = canvas.width;
    const CANVAS_H = canvas.height;

    // ------- ゲーム状態 -------
    let gameState = 'playing'; // 'playing' | 'gameover' | 'win'

    // キー入力管理
    const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

    // カメラオフセット（左端からのスクロール量）
    let offsetX = 0;

    // ------- オブジェクト定義 -------
    const player = {
        x: 50,
        y: 0,
        w: 30,
        h: 45,
        vx: 0,
        vy: 0,
        color: '#ff4040',
        onGround: false
    };

    const platforms = []; // {x,y,w,h}
    const enemies = [];   // {x,y,w,h,vx}
    let goal = null;      // {x,y,w,h}

    // ------- 初期化・リセット ----------
    function resetGame() {
        // プレイヤー
        player.x = 50;
        player.y = 0;
        player.vx = 0;
        player.vy = 0;
        player.onGround = false;

        // カメラ
        offsetX = 0;

        // プラットフォーム（簡易レベル）
        platforms.length = 0;
        // 地面
        platforms.push({x: -1000, y: CANVAS_H - 40, w: 5000, h: 40});
        // 複数の浮遊ブロック
        platforms.push({x: 300, y: CANVAS_H - 150, w: 120, h: 20});
        platforms.push({x: 600, y: CANVAS_H - 220, w: 150, h: 20});
        platforms.push({x: 950, y: CANVAS_H - 120, w: 100, h: 20});
        platforms.push({x: 1300, y: CANVAS_H - 180, w: 180, h: 20});
        platforms.push({x: 1650, y: CANVAS_H - 250, w: 120, h: 20});
        platforms.push({x: 2000, y: CANVAS_H - 130, w: 140, h: 20});

        // 敵配置
        enemies.length = 0;
        enemies.push({x: 550, y: CANVAS_H - 60, w: 30, h: 30, vx: 1.5});
        enemies.push({x: 1200, y: CANVAS_H - 80, w: 30, h: 30, vx: -2});
        enemies.push({x: 1800, y: CANVAS_H - 100, w: 30, h: 30, vx: 1});

        // ゴール（旗竿）
        goal = {x: 2300, y: CANVAS_H - 120, w: 30, h: 120};

        // 状態リセット
        gameState = 'playing';
    }

    // ------- 入力ハンドラ ----------
    function keyDown(e) {
        if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') {
            e.preventDefault();
            keys[e.code] = true;
        }
    }
    function keyUp(e) {
        if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'Space') {
            e.preventDefault();
            keys[e.code] = false;
        }
    }

    // ------- 当たり判定 ----------
    function rectIntersect(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x &&
               a.y < b.y + b.h && a.y + a.h > b.y;
    }

    // ------- 更新 ----------
    function update() {
        if (gameState !== 'playing') return;

        // ---- プレイヤー操作 ----
        if (keys.ArrowLeft) player.vx = -PLAYER_SPEED;
        else if (keys.ArrowRight) player.vx = PLAYER_SPEED;
        else player.vx *= FRICTION; // スムーズに減速

        // ジャンプ
        if (keys.Space && player.onGround) {
            player.vy = -JUMP_STRENGTH;
            player.onGround = false;
        }

        // 重力適用
        player.vy += GRAVITY;

        // 位置更新
        player.x += player.vx;
        player.y += player.vy;

        // ---- プラットフォーム衝突処理 ----
        player.onGround = false;
        platforms.forEach(p => {
            // 簡易AABBチェック
            const future = {x: player.x, y: player.y, w: player.w, h: player.h};
            if (rectIntersect(future, p)) {
                // 上から衝突したか判定
                const dyFromTop = (player.y + player.h) - p.y;
                const dyFromBottom = (p.y + p.h) - player.y;
                const dxFromLeft = (player.x + player.w) - p.x;
                const dxFromRight = (p.x + p.w) - player.x;

                // もっと小さな侵入深さで解決
                const minY = Math.min(dyFromTop, dyFromBottom);
                const minX = Math.min(dxFromLeft, dxFromRight);
                if (minY < minX) {
                    // 垂直衝突
                    if (dyFromTop < dyFromBottom) {
                        // 上から平台へ
                        player.y = p.y - player.h;
                        player.vy = 0;
                        player.onGround = true;
                    } else {
                        // 下から平台へ（頭がぶつかる）
                        player.y = p.y + p.h;
                        player.vy = 0;
                    }
                } else {
                    // 水平衝突
                    if (dxFromLeft < dxFromRight) {
                        player.x = p.x - player.w;
                    } else {
                        player.x = p.x + p.w;
                    }
                    player.vx = 0;
                }
            }
        });

        // ---- 敵の動きと衝突 ----
        enemies.forEach(e => {
            e.x += e.vx;

            // 簡易的に端で反転
            // 当たり判定用に見える範囲だけで判定
            if (e.x < 0 || e.x > 3000) e.vx *= -1;

            // プレイヤーと衝突したらゲームオーバー
            if (rectIntersect(player, e)) {
                gameState = 'gameover';
            }
        });

        // ---- ゴール判定 ----
        if (rectIntersect(player, goal)) {
            gameState = 'win';
        }

        // ---- カメラスクロール ----
        // プレイヤーが画面の中心より右にいるときだけカメラを動かす
        const camMargin = CANVAS_W * 0.4;
        if (player.x - offsetX > camMargin) {
            offsetX = player.x - camMargin;
        }
        // 左側は固定（最小0）
        if (offsetX < 0) offsetX = 0;
    }

    // ------- 描画 ----------
    function draw() {
        // 背景クリア
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.fillStyle = '#8bd4ff';
        ctx.fillRect(0,0,CANVAS_W,CANVAS_H);

        // すべてのオブジェクトは offsetX を引いて描画
        function drawRect(obj, color) {
            ctx.fillStyle = color;
            ctx.fillRect(obj.x - offsetX, obj.y, obj.w, obj.h);
        }

        // プラットフォーム
        platforms.forEach(p => drawRect(p, '#654321'));

        // 敵
        enemies.forEach(e => drawRect(e, '#000'));

        // ゴール（旗竿）
        drawRect(goal, '#0a0');

        // プレイヤー
        drawRect(player, player.color);

        // UI テキスト
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.fillRect(0,0,CANVAS_W,30);
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textBaseline = 'middle';
        ctx.fillText('← / → 移動   Space ジャンプ   目標地点まで進め！', 10, 15);
        if (gameState === 'gameover') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            ctx.fillStyle = '#f00';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('ゲームオーバー', CANVAS_W/2, CANVAS_H/2);
            ctx.font = '20px sans-serif';
            ctx.fillText('F5 キーで再スタート', CANVAS_W/2, CANVAS_H/2 + 40);
        } else if (gameState === 'win') {
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.fillRect(0,0,CANVAS_W,CANVAS_H);
            ctx.fillStyle = '#0f0';
            ctx.font = '48px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('クリア！', CANVAS_W/2, CANVAS_H/2);
            ctx.font = '20px sans-serif';
            ctx.fillText('F5 キーで再挑戦', CANVAS_W/2, CANVAS_H/2 + 40);
        }
    }

    // ------- メインループ ----------
    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    // ------- 初期化 ----------
    function init() {
        resetGame();
        // キーイベント登録
        window.addEventListener('keydown', keyDown);
        window.addEventListener('keyup', keyUp);
        // ループ開始（読み込み直後に自動スタート）
        requestAnimationFrame(loop);
    }

    // ページ読み込み完了時に init を呼び出す
    window.addEventListener('load', init);
})();
</script>
</body>
</html>
