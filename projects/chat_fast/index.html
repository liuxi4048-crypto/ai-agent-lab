<!DOCTYPE html>
<html>
<head>
<title>マリオ風アクションゲーム</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background-color: skyblue;
}
canvas {
  display: block;
}
</style>
</head>
<body>
  <canvas id="gameCanvas" width="640" height="480"></canvas>
  <div id="scoreContainer">スコア: 0</div>
  <div id="instructionContainer">
    操作方法: <br>
    矢印キーで移動、スペースキーでジャンプ
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreContainer = document.getElementById('scoreContainer');
    const instructionContainer = document.getElementById('instructionContainer');

    // ゲームオブジェクト
    let player = {
      x: 50,
      y: 350,
      width: 30,
      height: 40,
      speed: 3,
      velocityY: 0,
      gravity: 0.5,
      isJumping: false
    };

    let enemies = [];
    let goal = {
      x: 550,
      y: 350,
      width: 50,
      height: 50
    };

    let score = 0;

    // 画像 (Canvasで描画する絵文字を使用)
    const playerImage = '🍄';
    const enemyImage = '👾';
    const goalImage = '🏁';

    // 敵の生成間隔
    let enemySpawnInterval = 2000;
    let lastEnemySpawnTime = 0;

    // 初期化
    function init() {
      score = 0;
      updateScore();
      player.x = 50;
      player.y = 350;
      player.velocityY = 0;
      player.isJumping = false;
      enemies = [];
      lastEnemySpawnTime = 0;
    }

    // スコア表示の更新
    function updateScore() {
      scoreContainer.textContent = 'スコア: ' + score;
    }

    // 敵の生成
    function spawnEnemy() {
      if (Date.now() - lastEnemySpawnTime > enemySpawnInterval) {
        enemies.push({
          x: canvas.width,
          y: 350,
          width: 20,
          height: 30,
          speed: 1
        });
        lastEnemySpawnTime = Date.now();
        enemySpawnInterval = Math.max(500, enemySpawnInterval - 50); // 難易度上昇
      }
    }

    // ゲームループ
    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    // 更新処理
    function update() {
      // プレイヤーの入力処理
      if (keys['ArrowLeft']) {
        player.x -= player.speed;
      }
      if (keys['ArrowRight']) {
        player.x += player.speed;
      }

      // ジャンプ処理
      if (keys[' ']) {
        if (!player.isJumping) {
          player.velocityY = -10;
          player.isJumping = true;
        }
      }

      // 重力適用
      player.velocityY += player.gravity;
      player.y += player.velocityY;

      // 画面端でのリセット
      if (player.x < 0) {
        player.x = 0;
      }
      if (player.x > canvas.width - player.width) {
        player.x = canvas.width - player.width;
      }

      // 敵の移動
      for (let i = 0; i < enemies.length; i++) {
        enemies[i].x -= enemies[i].speed;
        if (enemies[i].x < 0) {
          enemies.splice(i, 1);
          i--;
        }
      }

      // 敵とプレイヤーの衝突判定
      for (let i = 0; i < enemies.length; i++) {
        if (
          player.x < enemies[i].x + enemies[i].width &&
          player.x + player.width > enemies[i].x &&
          player.y < enemies[i].y + enemies[i].height &&
          player.y + player.height > enemies[i].y
        ) {
          init();
          break;
        }
      }
      
      // ゴール判定
      if (
          player.x < goal.x + goal.width &&
          player.x + player.width > goal.x &&
          player.y < goal.y + goal.height &&
          player.y + player.height > goal.y
      ) {
          score += 10;
          updateScore();
          init();
      }

      spawnEnemy();
    }

    // 描画処理
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // プレイヤーの描画
      ctx.font = '30px Arial';
      ctx.fillText(playerImage, player.x, player.y);

      // 敵の描画
      for (let i = 0; i < enemies.length; i++) {
        ctx.font = '20px Arial';
        ctx.fillText(enemyImage, enemies[i].x, enemies[i].y);
      }

      // ゴールの描画
      ctx.font = '40px Arial';
      ctx.fillText(goalImage, goal.x, goal.y);

      // 操作方法の表示
      instructionContainer.textContent = '操作方法: 矢印キーで移動、スペースキーでジャンプ';
    }

    // キー入力処理
    let keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      e.preventDefault(); // 画面スクロールを防止
    });
    window.addEventListener('keyup', (e) => {
      keys[e.key] = false;
    });

    // ゲーム開始
    init();
    gameLoop();
  </script>
</body>
</html>
