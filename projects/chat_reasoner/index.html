<!DOCTYPE html>
<html>
<head>
    <title>Mario-like Game</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #333; }
        #gameContainer { width: 100vw; height: 100vh; position: relative; }
        #player, #ground, #enemies, #goal { position: absolute; }
        #player { width: 40px; height: 40px; background-color: #fff; }
        #ground { width: 100%; height: 50px; background-color: #666; }
        #platforms rect { fill: #666; }
        #enemies rect { fill: #ff0000; }
        #goal { width: 60px; height: 60px; background-color: #ffd700; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="player"></div>
        <div id="ground"></div>
        <svg id="platforms"></svg>
        <svg id="enemies"></svg>
        <div id="goal"></div>
        <div id="score">Score: 0</div>
    </div>
    <script>
        const player = document.getElementById('player');
        const ground = document.getElementById('ground');
        const platforms = document.getElementById('platforms');
        const enemies = document.getElementById('enemies');
        const goal = document.getElementById('goal');
        const scoreElement = document.getElementById('score');

        let score = 0;
        let gameLoop;
        let isGameOver = false;
        let isWin = false;

        const gameWidth = 800;
        const gameHeight = 600;
        const playerWidth = 40;
        const playerHeight = 40;

        // 初期化
        function initGame() {
            // 基本配置
            ground.style.width = `${gameWidth}px`;
            ground.style.height = `${playerHeight}px`;
            ground.style.bottom = '0px';

            // プラットフォーム作成
            createPlatforms();

            // インクルード
            createEnemies();

            // プレーヤーの初期位置
            player.style.left = `${(gameWidth - playerWidth) / 2}px`;
            player.style.bottom = `${playerHeight}px`;

            // イベントリスナー
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('keyup', handleKeyUp);

            // ゲームループ開始
            gameLoop = requestAnimationFrame(update);
        }

        // プラットフォーム作成
        function createPlatforms() {
            const svg = platforms;
            const platformCount = 4;
            const platformWidth = 100;
            const platformHeight = 20;
            const spacing = 50;

            for (let i = 0; i < platformCount; i++) {
                const platform = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                platform.setAttribute('x', `${i * (platformWidth + spacing)}${i === 0 ? '' : '-20'}`);
                platform.setAttribute('y', `${gameHeight - platformHeight - 100}`);
                platform.setAttribute('width', platformWidth);
                platform.setAttribute('height', platformHeight);
                platform.setAttribute('fill', '#666');
                svg.appendChild(platform);
            }
        }

        // 敵作成
        function createEnemies() {
            const svg = enemies;
            const enemyCount = 3;
            const enemyWidth = 30;
            const enemyHeight = 30;

            for (let i = 0; i < enemyCount; i++) {
                const enemy = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                enemy.setAttribute('x', `${i * (enemyWidth + 200)}`);
                enemy.setAttribute('y', `${gameHeight - enemyHeight - 200}`);
                enemy.setAttribute('width', enemyWidth);
                enemy.setAttribute('height', enemyHeight);
                enemy.setAttribute('fill', '#ff0000');
                svg.appendChild(enemy);
            }
        }

        // キーイベント
        let isJumping = false;
        let isMovingRight = false;
        let isMovingLeft = false;
        let speedX = 0;
        let gravity = 0.5;
        let jumpForce = -15;
        let groundLevel = playerHeight;

        function handleKeyDown(e) {
            if (isGameOver || isWin) return;

            switch(e.key) {
                case 'ArrowLeft':
                    isMovingLeft = true;
                    speedX = -5;
                    break;
                case 'ArrowRight':
                    isMovingRight = true;
                    speedX = 5;
                    break;
                case ' ':
                    if (!isJumping && !isGameOver && !isWin) {
                        jump();
                    }
                    break;
            }
        }

        function handleKeyUp(e) {
            switch(e.key) {
                case 'ArrowLeft':
                    isMovingLeft = false;
                    speedX = 0;
                    break;
                case 'ArrowRight':
                    isMovingRight = false;
                    speedX = 0;
                    break;
            }
        }

        function jump() {
            if (!isJumping && !isGameOver && !isWin) {
                isJumping = true;
                jumpForce = -15;
            }
        }

        function update(timestamp) {
            if (isGameOver || isWin) return;

            // 移動
            const playerRect = player.getBoundingClientRect();
            let newX = playerRect.left + speedX;

            // 境界チェック
            const leftBoundary = 0;
            const rightBoundary = gameWidth - playerWidth;
            newX = Math.max(leftBoundary, Math.min(newX, rightBoundary));

            player.style.left = `${newX}px`;

            // ジャンプ
            if (isJumping) {
                let newY = playerRect.top + jumpForce;
                jumpForce += gravity;
                if (newY > groundLevel) {
                    newY = groundLevel;
                    isJumping = false;
                    jumpForce = 0;
                }
                player.style.top = `${newY}px`;
            }

            // プラットフォームとの当たり判定
            const platforms = document.querySelectorAll('rect');
            platforms.forEach(platform => {
                const platRect = platform.getBoundingClientRect();
                if (isCollision(playerRect, platRect)) {
                    if (jumpForce > 0) {
                        isJumping = false;
                        jumpForce = 0;
                    }
                    groundLevel = playerRect.bottom;
                }
            });

            // 敵との当たり判定
            const enemies = document.querySelectorAll('#enemies rect');
            enemies.forEach(enemy => {
                const enemyRect = enemy.getBoundingClientRect();
                if (isCollision(playerRect, enemyRect)) {
                    gameOver();
                }
            });

            // ゴール判定
            const goalRect = goal.getBoundingClientRect();
            if (isCollision(playerRect, goalRect)) {
                win();
            }

            score++;
            scoreElement.textContent = `Score: ${score}`;

            gameLoop = requestAnimationFrame(update);
        }

        function isCollision(rect1, rect2) {
            return rect1.left < rect2.right &&
                   rect1.right > rect2.left &&
                   rect1.top < rect2.bottom &&
                   rect1.bottom > rect2.top;
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(gameLoop);
            alert('Game Over! Score: ' + score);
            initGame(); // 再スタート
        }

        function win() {
            isWin = true;
            cancelAnimationFrame(gameLoop);
            alert('Win! Score: ' + score);
            initGame(); // 再スタート
        }

        // ゲームの初期化を呼び出す
        initGame();
    </script>
</body>
</html>
