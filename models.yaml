# 16GB VRAM (RX 9070 XT / ROCm gfx1201) + 64GB RAM 前提のモデルマトリクス。
# placement:
#   vram   = VRAMに全載り → 並列スロット(OLLAMA_NUM_PARALLEL)の対象にできる
#   hybrid = VRAM+RAMオフロード(=本機での実用的な「RAM仮想VRAM」) → 直列実行を強制
# num_ctx はリクエスト毎に options.num_ctx で送る(ネイティブ/api/chatで有効・実測済み)。
# num_gpu: GPUへ載せる層数。省略=Ollama自動。0=CPU専用。大型modelでVRAM超過時に
#   attention+KVだけVRAMへ置き、expert層をRAMへ逃がす調整に使う。
# ram_gb: モデル本体がRAM側に必要とする概算容量(GB)。空きRAMが足りないモデルは
#   選択肢から外し、ページング(極端な低速化)を避けるための目安。
# tools: function calling 対応。false のモデルはチャット/批評専用(コーディングエージェント不可)。
# options: モデル公式推奨のサンプリング値(llm.py が既定として送る。呼び出し側の明示指定が優先)。
#   min_p は llama.cpp 既定 0.1 に上書きされないよう必ず明示する(Qwen/gpt-oss 公式は 0)。
# think: thinking の既定指定(gpt-oss系="low"/"medium"/"high", deepseek系=true/false)。
#   省略=モデル既定。think 非対応モデルには送らない(llm.py 側で未設定なら送信しない)。
# strengths: ルーティング(model=auto)と批評ペア選定に使う。
# for: UIのモデル選択に「タグ名 (用途)」として出す短い説明。
models:
  worker:
    tag: "gpt-oss:20b"
    family: gpt-oss
    placement: vram          # ~13GB 全載り。swarm並列の主役
    tools: true
    num_ctx: 16384
    options: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0}   # OpenAI公式推奨
    strengths: [tool, speed, reasoning]
    for: "最速・軽快。普段づかい/並列作業"
    use: "並列ワーカー / VRAM全載りMoE(活性3.6B) / swarm・planner・merger向け"
  coder:
    tag: "qwen3:30b"
    family: qwen
    placement: hybrid        # 18GB・77%GPU(50 tok/s実測)。spillするため並列不可
    tools: true
    num_ctx: 16384
    ram_gb: 6                # 18GBのうちVRAMに載り切らない分だけRAMへ
    options: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, repeat_penalty: 1.05}  # Qwen3公式(non-thinking/coder)
    strengths: [coding, tool]
    for: "コーディング主力。バランス型"
    use: "主力コーダー / MoE(活性≈3B) / codeモード既定"
  smart:
    tag: "qwen3.6:35b"
    family: qwen
    placement: hybrid
    tools: true
    num_ctx: 16384
    ram_gb: 10
    options: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, repeat_penalty: 1.05}
    strengths: [coding, reasoning]
    for: "高品質コーディング。難しい実装向け"
    use: "上位MoE(SWE-bench 73.4%) / 難しい実装・レビュアー"
  glimmer:
    tag: "muse-glimmer:30b"
    family: meta
    placement: hybrid        # 18GB dense(28Bデコーダ+2B vision) → 13.4 tok/s実測(2026-08-12)
    tools: true
    num_ctx: 16384           # GQA 16:1 でKVが小さく128K対応だが、hybrid時はVRAM節約を優先
    ram_gb: 6
    options: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0}  # Meta公式推奨
    think: "low"             # 既定でthinkingが長く、13tok/sではループが重い。planner等はeffortで上げる
    strengths: [tool, coding, reasoning]
    for: "エージェント特化(Meta)。ツール呼び出しに強い"
    use: "agentic特化 / SWE-bench V 76.0 / dense28B・13.4tok/s実測 / reasoning effort可変"
  pro:
    tag: "qwen3.8:27b"
    family: qwen35           # qwen3系とはthink/サンプリングの作法が違うので family を分ける
    placement: hybrid        # 18GB(本体17GB + vision projector 0.9GB) → 25%/75% CPU/GPU 実測
    tools: true
    num_ctx: 16384           # ネイティブ256Kだが、KVを積むとVRAMを食うので既定は据え置き
    ram_gb: 6
    keep_alive: "10m"
    # thinking時のQwen公式推奨。repeat_penalty=1.0(無効)がモデルの焼き込み既定でもある
    options: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1.0}
    # think:false のときに使う non-thinking(Instruct)側の公式推奨。presence_penalty=1.5 が特徴
    options_no_think: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, presence_penalty: 1.5, repeat_penalty: 1.0}
    think: "low"             # 既定ONかつ深めなので明示的に浅くする(tools併用も実測で正常)
    strengths: [coding, tool, reasoning]   # visionは対応するがアプリ側に画像送信の経路が無い
    for: "最新Qwen。高品質・長文脈のエージェント"
    use: "dense27.3B+vision / 64層中16層のみfull attention=KVが通常の約1/4 / MTP自己投機ON /
      23 tok/s実測(同サイズdenseのglimmer 13.4の1.7倍) /
      SWE-bench Pro 61.7・Terminal-Bench2.1 73.0・OSWorld 84.3(いずれもQwen自己計測)"

  reasoner:
    tag: "deepseek-r1:14b"
    family: deepseek
    placement: vram          # 9.3GB 全載り
    tools: false             # R1系はfunction calling非対応(批評・推論専用)
    num_ctx: 16384
    options: {temperature: 0.6, top_p: 0.95, min_p: 0}   # DeepSeek公式推奨
    strengths: [reasoning, math]
    for: "推論・数学。考察向き(コード生成は不可)"
    use: "深い推論・数学(CoT) / 批評ループの異ファミリーレビュアー"
  deep:
    tag: "deepseek-r1:70b"
    family: deepseek
    placement: hybrid        # 42GB dense → 1.6 tok/s実測。時間をかけてよい推論専用
    tools: false
    num_ctx: 8192
    keep_alive: "10m"        # 大型hybridはRAM占有を抑えるため短め(既定30m)
    ram_gb: 42               # dense 42GB。帯域律速で1.6 tok/s実測
    options: {temperature: 0.6, top_p: 0.95, min_p: 0}
    strengths: [reasoning, math]
    for: "最も深い推論。非常に低速(コード生成は不可)"
    use: "DeepSeek最大 / VRAM+RAM / 低速・最深推論枠"
  next:
    tag: "qwen3-coder-next"
    family: qwen
    placement: hybrid        # 51GB MoE(80B総/活性3B) → 21.2 tok/s実測・ロード29s(2026-08-12)
    tools: true
    num_ctx: 16384
    keep_alive: "10m"
    ram_gb: 46               # 51GBのうちVRAM超過分
    options: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, repeat_penalty: 1.05}  # Qwen3-Coder公式
    strengths: [coding, tool, reasoning]
    for: "最高品質コーディング(RAM併用)"
    use: "Qwen3-Next-80B-A3Bベースのコーディング特化 / SWE-bench V 70+ / hybrid筆頭(gpt-oss:120bの2倍速)"
  # 旧 next(hf.co/unsloth/Qwen3-Next-80B-A3B-Instruct-GGUF:Q4_K_M)は空応答バグで無効化
  # (0.32.9 でも再現を確認 2026-08-12)。公式パッケージの qwen3-coder-next を後継として採用。
  # 旧GGUF(48GB)は不要なら `ollama rm hf.co/unsloth/Qwen3-Next-80B-A3B-Instruct-GGUF:Q4_K_M` で解放可。
  heavy:
    tag: "gpt-oss:120b"
    family: gpt-oss
    placement: hybrid        # 65GB MoE(活性5.1B) → 10.7 tok/s実測
    tools: true
    num_ctx: 16384
    keep_alive: "10m"        # 大型hybridはRAM占有を抑えるため短め(既定30m)
    ram_gb: 61               # RAM 61.6GB にギリギリ。空きが少ないとページングする
    options: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0}
    strengths: [tool, reasoning]
    for: "最大モデル。難所向け・低速"
    use: "最大モデル / VRAM+RAM / 難所のみ"
  fast:
    tag: "gemma3:12b"
    family: gemma
    placement: vram
    tools: false             # gemma3はtools非対応=chat専用
    num_ctx: 16384
    options: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0}  # Google公式推奨
    strengths: [chat, speed]
    for: "軽量チャット・多言語(コード生成は不可)"
    use: "高速チャット・多言語 / 非エージェント"

default: coder

# 批評ループの異ファミリーペア既定(router.pyが参照)。
# レビュアーは原則 vram 常駐の reasoner に寄せる: hybrid 同士のペア(旧 heavy→smart 等)は
# 批評ラウンド毎に大型モデルの交互ロード(25〜65秒×2/ラウンド)が発生していた。
critique_pairs:
  coder: reasoner      # 作成者=Qwen coder → レビュアー=DeepSeek(視点の多様性)
  smart: reasoner
  worker: reasoner
  glimmer: reasoner
  pro: reasoner
  next: reasoner
  heavy: reasoner
  reasoner: worker
  deep: worker
