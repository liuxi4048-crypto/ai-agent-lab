# 16GB VRAM (RX 9070 XT / ROCm gfx1201) + 64GB RAM 前提のモデルマトリクス。
#
# 【共有契約】このファイルは ai-agent-lab 専用ではない。vault-search
# (vaultsearch/config.py: ASK_DEFAULT_MODEL="fast") と vault-distill
# (vaultdistill/config.py: EXTRACT_MODEL="fast") が読み取り専用で参照し、
# キーが無いと SystemExit で即死する。キーを消す前に、拡張子を絞らず
# C:\dev と ~/.claude を横断 grep して外部参照ゼロを確認すること。
#
# tier: モデルの選定状態(2026-08-22 再設計で導入。router.usable() が参照)
#   agent     = エージェント適格(実タスク完走の実測あり)。自動ルーティング対象
#   critic    = 批評専用(tools非対応でも可)。自動ルーティング対象(chat系のみ)
#   probation = 保留。ツール必須経路(code/swarm-code)からのみ自動除外。
#               chat系では候補に残る(再ベンチで agent か archive へ確定させる)
#   external  = 外部システム専用。ai-agent-lab の自動ルーティングから常に除外
#   archive   = 退役。自動ルーティングから常に除外(明示指定でのみ使用可)
# placement:
#   vram   = VRAMに全載り → 並列スロット(OLLAMA_NUM_PARALLEL)の対象にできる
#   hybrid = VRAM+RAMオフロード(=本機での実用的な「RAM仮想VRAM」) → 直列実行を強制
# num_ctx はリクエスト毎に options.num_ctx で送る(ネイティブ/api/chatで有効・実測済み)。
# num_gpu: GPUへ載せる層数。省略=Ollama自動。0=CPU専用。大型modelでVRAM超過時に
#   attention+KVだけVRAMへ置き、expert層をRAMへ逃がす調整に使う。
# ram_gb: モデル本体がRAM側に必要とする概算容量(GB)。空きRAMが足りないモデルは
#   選択肢から外し、ページング(極端な低速化)を避けるための目安。
# tools: function calling 対応。false のモデルはチャット/批評専用(コーディングエージェント不可)。
# mtp: MTP(Multi-Token Prediction)テンソルを同梱し、Ollamaの自己投機デコードが効くか。
#   判定は `ollama show <tag>` の Parameters に draft_num_predict があるかどうか。
#   ※選定の判断軸であって、コードからは読んでいない(Ollamaがモデル側の既定で有効化する)。
#   2026-08-21実測: MTP有無で2倍以上開く。パラメータ数やファイルサイズより効く。
#     qwen3.8:27b  21.5 tok/s → draft_num_predict=0 で 9.4 tok/s (2.3倍)
#     nemotron-3.5-lightning 42.4 → 33.5 (1.27倍)
#   外付けドラフタは不可: 別GGUFを DRAFT に指定すると Ollama 0.32.14 は MTP 経路に入り
#   「context type MTP requested but model doesn't contain MTP layers」で起動に失敗する
#   (qwen3:30b + qwen3:1.7b、vocab 151936 一致でも不可)。恩恵はMTP同梱モデルに限られる。
# options: モデル公式推奨のサンプリング値(llm.py が既定として送る。呼び出し側の明示指定が優先)。
#   min_p は llama.cpp 既定 0.1 に上書きされないよう必ず明示する(Qwen/gpt-oss 公式は 0)。
# think: thinking の既定指定(gpt-oss系="low"/"medium"/"high", deepseek系=true/false)。
#   省略=モデル既定。think 非対応モデルには送らない(llm.py 側で未設定なら送信しない)。
# strengths: ルーティング(model=auto)と批評ペア選定に使う。
# for: UIのモデル選択に「タグ名 (用途)」として出す短い説明。
models:
  worker:
    tag: "gpt-oss:20b"
    family: gpt-oss
    tier: agent          # 実タスク5.6分◯(2026-08-20)・108.7 tok/s(08-21)
    placement: vram          # ~13GB 全載り。swarm並列の主役
    tools: true
    mtp: false
    num_ctx: 16384
    options: {temperature: 1.0, top_p: 1.0, top_k: 0, min_p: 0}   # OpenAI公式推奨
    strengths: [tool, speed, reasoning]
    for: "最速・軽快。普段づかい/並列作業"
    use: "並列ワーカー / VRAM全載りMoE(活性3.6B) / swarm・planner・merger向け"
  coder:
    tag: "qwen3:30b"
    family: qwen
    tier: agent          # 実タスク14分◯(2026-08-20)・44.2 tok/s(08-21)
    placement: hybrid        # 18GB・77%GPU(50 tok/s実測)。spillするため並列不可
    tools: true
    mtp: false
    num_ctx: 16384
    ram_gb: 6                # 18GBのうちVRAMに載り切らない分だけRAMへ
    options: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, repeat_penalty: 1.05}  # Qwen3公式(non-thinking/coder)
    strengths: [coding, tool]
    for: "コーディング主力。バランス型"
    use: "主力コーダー / MoE(活性≈3B) / codeモード既定"
  smart:
    tag: "qwen3.6:35b"
    family: qwen
    tier: agent          # 実タスク16分◯・成果物22KB最大(2026-08-20)
    placement: hybrid
    tools: true
    mtp: false
    num_ctx: 16384
    ram_gb: 10
    options: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, repeat_penalty: 1.05}
    strengths: [coding, reasoning]
    for: "高品質コーディング。難しい実装向け"
    use: "上位MoE(SWE-bench 73.4%) / 難しい実装・レビュアー"
  glimmer:
    tag: "muse-glimmer:30b"
    family: meta
    tier: agent          # 実タスク7.8分◯=完走2位(2026-08-20)。tok/s(9.7)と完走時間が逆転する実測反例
    placement: hybrid        # 18GB dense(28Bデコーダ+2B vision)。9.7 tok/s実測(2026-08-21)
                             # ※2026-08-12の13.4は別条件の値。同一条件で測り直すと9.7。
                             # 公開時アナウンスのドラフタDFlashはOllamaパッケージに入って
                             # おらず、draft_num_predictを4/8にしても変化しない(実測)。
    tools: true
    mtp: false
    num_ctx: 16384           # GQA 16:1 でKVが小さく128K対応だが、hybrid時はVRAM節約を優先
    ram_gb: 6
    options: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0}  # Meta公式推奨
    think: "low"             # 既定でthinkingが長く、13tok/sではループが重い。planner等はeffortで上げる
    strengths: [tool, coding, reasoning]
    for: "エージェント特化(Meta)。ツール呼び出しに強い"
    use: "agentic特化 / SWE-bench V 76.0 / dense28B・9.7tok/s実測(2026-08-21) /
      MTP非同梱で自己投機が効かず、同サイズのproに2.2倍差をつけられる / reasoning effort可変"
  pro:
    tag: "qwen3.8:27b"
    family: qwen35           # qwen3系とはthink/サンプリングの作法が違うので family を分ける
    tier: probation      # 実タスク44.5分×(25反復未完・2026-08-20・1サンプル)のためツール必須経路から除外。
                         # ただし chat難問分岐(既定allow_ram=False)では唯一の受け皿なので chat系には残す。
                         # 再ベンチ(html/script/chatの3課題・num_ctx16384)で agent か archive へ確定させること
    placement: hybrid        # 18GB(本体17GB + vision projector 0.9GB) → 25%/75% CPU/GPU 実測
    tools: true
    mtp: true                # draft_num_predict 4 が焼き込み済み。切ると 21.5→9.4 tok/s
    num_ctx: 16384           # ネイティブ256Kだが、KVを積むとVRAMを食うので既定は据え置き
    ram_gb: 6
    keep_alive: "10m"
    # thinking時のQwen公式推奨。repeat_penalty=1.0(無効)がモデルの焼き込み既定でもある
    options: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1.0}
    # think:false のときに使う non-thinking(Instruct)側の公式推奨。presence_penalty=1.5 が特徴
    options_no_think: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, presence_penalty: 1.5, repeat_penalty: 1.0}
    think: "low"             # 既定ONかつ深めなので明示的に浅くする(tools併用も実測で正常)
    strengths: [coding, tool, reasoning]   # visionは対応するがアプリ側に画像送信の経路が無い
    for: "最新Qwen。高品質・長文脈のエージェント"
    use: "dense27.3B+vision / 64層中16層のみfull attention=KVが通常の約1/4 / MTP自己投機ON /
      21.5 tok/s実測(2026-08-21。同サイズdenseのglimmer 9.7 の2.2倍。差はMTP自己投機) /
      SWE-bench Pro 61.7・Terminal-Bench2.1 73.0・OSWorld 84.3(いずれもQwen自己計測) /
      実タスク(マリオ風ゲーム)では44分・25反復を使い切って未完(2026-08-20、1サンプル)"

  reasoner:
    tag: "deepseek-r1:14b"
    family: deepseek
    tier: critic         # vram 9GB=交代質量最小の批評役。異ファミリーレビューの要
    placement: vram          # 9.3GB 全載り
    tools: false             # R1系はfunction calling非対応(批評・推論専用)
    num_ctx: 16384
    options: {temperature: 0.6, top_p: 0.95, min_p: 0}   # DeepSeek公式推奨
    strengths: [reasoning, math]
    for: "推論・数学。考察向き(コード生成は不可)"
    use: "深い推論・数学(CoT) / 批評ループの異ファミリーレビュアー"
  ornith:
    tag: "ornith:1.5-9b"     # = hf.co/ornith-ai/Ornith-1.5-9B-GGUF:Q8_0(同一blob・別タグ)
    family: qwen35           # architecture=qwen35。think/サンプリングはQwen3.5系の作法(effort()対応済み)
    tier: probation      # 2026-08-23導入・未ベンチ。tools対応だが実タスク完走の実測が無いため
                         # ツール必須経路(code/swarm-code)からは自動除外。--model ornith と chat系では使用可。
                         # bench_suite(html/script/chat)で測り agent か archive へ確定させること
    placement: vram          # Q8_0=9.5GB → 16GB VRAM に全載り。KVはqwen35の間引きattentionで軽い
    tools: true              # ollama show の Capabilities に tools あり(thinking/vision も対応)
    mtp: false               # draft_num_predict の焼き込み無し(ollama show Parameters)=自己投機なし
    num_ctx: 16384           # ネイティブ262K(YaRNで~1M)。KV節約のため既定は据え置き
    think: "low"             # 推論デフォルトON(<think>)。思考は panel が strip。深追いは抑える(effortで可変)
    # 公式推奨(精密コーディング側)。presence_penalty=0 でコードの反復トークンを過剰に罰しない
    options: {temperature: 0.6, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1.0}
    # think:false 時に使う一般タスク側の公式推奨(presence_penalty=1.5・temp1.0)
    options_no_think: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 1.5, repeat_penalty: 1.0}
    strengths: [coding, reasoning, tool]
    for: "自己改善型・コーディング特化(9B)。省VRAM常駐"
    use: "Qwen3.5派生の自己改善RLモデル / dense9B・Q8_0で9.5GB全載り / tools・thinking・vision対応
      (画像送信の経路はアプリ側に無い) / ターミナル型コーディングエージェント最適化 /
      実タスク未ベンチ=probation。MindStudio検証ではベンチ値ほど実用性能が出ないとの指摘あり要実測"
  # === 2026-08-23 追加: 最新ローカルLLMの系統多様化(Google/IBM/Mistral/Zhipu)。いずれも未ベンチ=probation ===
  # 選定根拠と実測は docs には未記載。各tool-calling疎通・placement・tok/sはこのファイル追加時にsmoke実測(2026-08-23)。
  gemma:
    tag: "gemma4:26b-a4b-it-qat"   # 公式QAT(Q4_0相当)。要Ollama>=0.30.5(現0.32.15)
    family: gemma4           # effort()未対応=graded think不可。thinkはbool(True/False/"low"を受理、実測)
    tier: probation      # 2026-08-23導入・未ベンチ。--model gemma と chat系で使用可、ツール必須経路からは自動除外
    placement: vram          # 実測 94%GPU/14.4GB・59.5tok/s。VRAMほぼ全載り(~6%のみRAM)。MoE活性≈4Bで軽い
    tools: true              # Capabilities: tools/thinking/vision すべて対応(vision projector 573M・画像経路はアプリに無い)
    mtp: false               # 焼き込みdraftなし。公式ドラフタは別途Modelfile DRAFTで付与可(未適用)
    num_ctx: 16384           # ネイティブ262K
    # Google公式推奨。min_pはllama.cpp既定0.1に上書きされないよう明示
    options: {temperature: 1.0, top_p: 0.95, top_k: 64, min_p: 0}
    # think既定ON(<think>)。smokeでcontentは正常返却。速度優先ならthink:falseを呼び出し側で
    strengths: [tool, reasoning, chat]
    for: "Google新世代・マルチモーダル。VRAM全載りで高速"
    use: "MoE 25.2B/活性≈4B(gemma4) / tools・thinking・vision対応 / 94%GPU・59.5tok/s実測(2026-08-23) /
      ツールコール中断バグはdense31B版の報告でありMoE版では未再現(smoke OK) / 系統多様化(Google)"
  granite:
    tag: "granite4.1:8b-q8_0"   # 8B級はQ8でも軽い。tool-caller/ルーター役として品質優先でQ8採用
    family: granite
    tier: probation      # 2026-08-23導入・未ベンチ
    placement: vram          # 実測 100%GPU/10.6GB・56.8tok/s。完全VRAM常駐で重量級と役割分担しやすい
    tools: true              # Capabilities: tools のみ(thinking/vision なし)
    mtp: false
    num_ctx: 16384           # ネイティブ131K
    # 焼き込みサンプリング値なし。tool-calling/ルーティング用途に低温度の保守設定(公式値ではない)
    options: {temperature: 0.2, top_p: 0.95, top_k: 20, min_p: 0}
    strengths: [tool, speed]
    for: "IBM軽量tool-caller/ルーター(コーディング主力ではない)"
    use: "dense8.8B・Q8_0 / BFCL v3 68.27(IBM自己申告)=tool-calling特化 / 100%GPU・56.8tok/s実測 /
      エージェント型コーディングには非推奨の第三者評あり=ツール呼び出し・ルーティングの下請け役に限定 / 系統多様化(IBM)"
  devstral:
    tag: "devstral-small-2:24b-instruct-2512-q4_K_M"   # 2512版=真のDevstral2(旧devstral:24bは2505版で別物)
    family: mistral
    tier: probation      # 2026-08-23導入・未ベンチ
    placement: hybrid        # 実測 88%GPU/14.9GB・22.6tok/s。dense24Bで一部RAMへ溢れ低速。直列実行
    ram_gb: 3
    tools: true              # Capabilities: tools/vision(thinkingなし・Instruct)
    mtp: false
    num_ctx: 16384           # ネイティブ393K
    options: {temperature: 0.15, top_p: 0.95, min_p: 0}   # Mistralコーディング既定(焼き込みtemp0.15)
    strengths: [coding, tool]
    for: "Mistral系コーディングエージェント。OpenHands系で強い"
    use: "dense24B(mistral3) / SWE-bench Verified 68%(Mistral自己申告・SWE-bench汚染問題で要割引) /
      Aiderの厳密diff編集は苦手(第三者実測でQ8 4-8%)=SWE-Agent/OpenHands系ハーネス向き / tools・vision対応 /
      hybrid 88%GPU・22.6tok/s実測 / 系統多様化(Mistral)"
  glm:
    tag: "glm-4.7-flash:q4_K_M"
    family: glm              # thinkはbool(True/False/"low"を受理、実測)。effort()未対応
    tier: probation      # 2026-08-23導入・未ベンチ
    placement: hybrid        # 実測 80%GPU/15.8GB・37.9tok/s。MoE活性3Bで溢れても実用速度。直列実行
    ram_gb: 4
    tools: true              # Capabilities: tools/thinking(visionなし)
    mtp: false
    num_ctx: 16384           # ネイティブ203K
    options: {temperature: 1.0, top_p: 0.95, min_p: 0.01, repeat_penalty: 1.0}   # Zhipu焼き込み既定
    strengths: [tool, coding, reasoning]
    for: "Zhipu新世代MoE・エージェント志向(MIT)"
    use: "MoE 29.9B/活性3B(glm4moelite) / SWE-bench Verified 59.2%・τ²-Bench(マルチステップtool)79.5(自己申告) /
      tools・thinking対応・think既定ON / hybrid 80%GPU・37.9tok/s実測 / 系統多様化(Zhipu)"
  # === 2026-08-28 追加: model-radar からpullした新着(未ベンチ=probation・tok/s未実測)===
  # placement/ram_gb はサイズからの暫定値。arch/params/capabilities は ollama show 実測。
  # qwen35系は pro/ornith と同じ公式サンプリング(thinking/instruct 別プロファイル)。
  distill9b:
    tag: "qwen3.8-distill:9b"       # = hf.co/empero-ai/Qwen3.8-9B-Distill-GGUF:q4_K_M(ollama cpで短縮)
    family: qwen35
    tier: probation
    placement: vram          # 5.8GB 全載り
    tools: true              # ollama show: tools/thinking
    mtp: false
    num_ctx: 16384           # ネイティブ262K
    options: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1.0}
    options_no_think: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, presence_penalty: 1.5, repeat_penalty: 1.0}
    think: "low"
    strengths: [coding, tool, reasoning]
    for: "Qwen3.8蒸留9B。省VRAM常駐"
    use: "Qwen3.8-9B蒸留(qwen35) / dense9.2B・q4で5.8GB全載り / tools・thinking / 未ベンチ=probation"
  distill4b:
    tag: "qwen3.8-distill:4b"       # = hf.co/empero-ai/Qwen3.8-4B-Distill-GGUF:q4_K_M(別名)
    family: qwen35
    tier: probation
    placement: vram
    tools: true
    mtp: false
    num_ctx: 16384
    options: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1.0}
    options_no_think: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, presence_penalty: 1.5, repeat_penalty: 1.0}
    think: "low"
    strengths: [tool, speed, reasoning]
    for: "Qwen3.8蒸留4B。軽量・高速"
    use: "Qwen3.8-4B蒸留(qwen35) / dense4.3B・2.8GB / 一次受け・仕分け向き / 未ベンチ=probation"
  distill2b:
    tag: "qwen3.8-distill:2b"       # = hf.co/empero-ai/Qwen3.8-2B-Distill-GGUF:q4_K_M(別名)
    family: qwen35
    tier: probation
    placement: vram
    tools: true
    mtp: false
    num_ctx: 16384
    options: {temperature: 1.0, top_p: 0.95, top_k: 20, min_p: 0, presence_penalty: 0, repeat_penalty: 1.0}
    options_no_think: {temperature: 0.7, top_p: 0.8, top_k: 20, min_p: 0, presence_penalty: 1.5, repeat_penalty: 1.0}
    think: "low"
    strengths: [speed, tool]
    for: "Qwen3.8蒸留2B。最軽量"
    use: "Qwen3.8-2B蒸留(qwen35) / dense1.94B・1.3GB / ドラフト/仕分けの最下請け / 未ベンチ=probation"
  lfm:
    tag: "lfm2.5:2.6b"              # = hf.co/LiquidAI/LFM2.5-2.6B-GGUF:q4_K_M(別名)
    family: lfm2             # 独自arch。effort()未対応=graded think不可
    tier: probation
    placement: vram          # 1.7GB 全載り
    tools: true              # ollama show: tools/thinking
    mtp: false
    num_ctx: 16384           # ネイティブ131K
    options: {temperature: 0.3, min_p: 0.15, repeat_penalty: 1.05}   # LiquidAI推奨(低温)
    strengths: [tool, speed, chat]
    for: "Liquid AI 省メモリ(2.6B)。オンデバイス志向"
    use: "LFM2.5-2.6B(lfm2) / メモリ2.5GB未満クラス / ツール利用・指示追従特化(コード性能は限定) / 未ベンチ=probation"
  dirk:
