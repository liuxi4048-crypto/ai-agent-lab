# 16GB VRAM (RX 9070 XT / ROCm gfx1201) + 64GB RAM 前提のモデルマトリクス。
# placement:
#   vram   = VRAMに全載り → 並列スロット(OLLAMA_NUM_PARALLEL)の対象にできる
#   hybrid = VRAM+RAMオフロード(=本機での実用的な「RAM仮想VRAM」) → 直列実行を強制
# num_ctx はリクエスト毎に options.num_ctx で送る(ネイティブ/api/chatで有効・実測済み)。
# tools: function calling 対応。false のモデルはチャット/批評専用(コーディングエージェント不可)。
# strengths: ルーティング(model=auto)と批評ペア選定に使う。
models:
  worker:
    tag: "gpt-oss:20b"
    family: gpt-oss
    placement: vram          # ~13GB 全載り。swarm並列の主役
    tools: true
    num_ctx: 16384
    strengths: [tool, speed, reasoning]
    use: "並列ワーカー / VRAM全載りMoE(活性3.6B) / swarm・planner・merger向け"
  coder:
    tag: "qwen3:30b"
    family: qwen
    placement: hybrid        # 18GB・77%GPU(50 tok/s実測)。spillするため並列不可
    tools: true
    num_ctx: 16384
    strengths: [coding, tool]
    use: "主力コーダー / MoE(活性≈3B) / codeモード既定"
  smart:
    tag: "qwen3.6:35b"
    family: qwen
    placement: hybrid
    tools: true
    num_ctx: 16384
    strengths: [coding, reasoning]
    use: "上位MoE(SWE-bench 73.4%) / 難しい実装・レビュアー"
  reasoner:
    tag: "deepseek-r1:14b"
    family: deepseek
    placement: vram          # 9.3GB 全載り
    tools: false             # R1系はfunction calling非対応(批評・推論専用)
    num_ctx: 16384
    strengths: [reasoning, math]
    use: "深い推論・数学(CoT) / 批評ループの異ファミリーレビュアー"
  deep:
    tag: "deepseek-r1:70b"
    family: deepseek
    placement: hybrid        # 42GB dense → 1.6 tok/s実測。時間をかけてよい推論専用
    tools: false
    num_ctx: 8192
    keep_alive: "10m"        # 大型hybridはRAM占有を抑えるため短め(既定30m)
    strengths: [reasoning, math]
    use: "DeepSeek最大 / VRAM+RAM / 低速・最深推論枠"
  # next(Qwen3-Next-80B-A3B)は 2026-07-27 時点で無効化。
  # 48GB の GGUF 導入自体は成功したが、Ollama 0.32.1/0.32.4 とも qwen3next アーキの
  # 推論が空応答(1トークン即EOS)になる既知の互換問題(FA/KV設定無関係と切り分け済み)。
  # Ollamaが対応したらコメントを外して再評価する。それまでの hybrid 筆頭は heavy。
  # next:
  #   tag: "hf.co/unsloth/Qwen3-Next-80B-A3B-Instruct-GGUF:Q4_K_M"
  #   family: qwen
  #   placement: hybrid
  #   tools: true
  #   num_ctx: 16384
  #   strengths: [coding, tool, reasoning]
  #   use: "Qwen最大 / VRAM+RAM筆頭 / 高品質エージェント"
  heavy:
    tag: "gpt-oss:120b"
    family: gpt-oss
    placement: hybrid        # 65GB MoE(活性5.1B) → 10.7 tok/s実測
    tools: true
    num_ctx: 16384
    keep_alive: "10m"        # 大型hybridはRAM占有を抑えるため短め(既定30m)
    strengths: [tool, reasoning]
    use: "最大モデル / VRAM+RAM / 難所のみ"
  fast:
    tag: "gemma3:12b"
    family: gemma
    placement: vram
    tools: false             # gemma3はtools非対応=chat専用
    num_ctx: 16384
    strengths: [chat, speed]
    use: "高速チャット・多言語 / 非エージェント"

default: coder

# 批評ループの異ファミリーペア既定(router.pyが参照)。
critique_pairs:
  coder: reasoner      # 作成者=Qwen coder → レビュアー=DeepSeek(視点の多様性)
  smart: reasoner
  worker: reasoner
  next: reasoner
  heavy: smart
  reasoner: worker
  deep: smart
