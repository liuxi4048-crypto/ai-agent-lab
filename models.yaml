default: coder

# カスケード(安価な一次受け → 本命 → 上位のエスカレーション)。
# router.escalation_ladder が参照する。false にすると従来どおり pick_model の
# 一発選択で最後まで走る。
# 2026-08-21実測: worker(gpt-oss:20b, VRAM全載り) 108.7 tok/s・ロード17.3s に対し
# coder(qwen3:30b, hybrid) 44.2 tok/s・ロード27.1s。簡単なタスクは worker が
# 3反復で完了し、hybrid のロードもスピルも一切払わずに済む(実測)。
cascade: true

# 批評ループの異ファミリーペア既定(router.pyが参照)。
# レビュアーは原則 vram 常駐の reasoner に寄せる: hybrid 同士のペア(旧 heavy→smart 等)は
# 批評ラウンド毎に大型モデルの交互ロード(25〜65秒×2/ラウンド)が発生していた。
critique_pairs:
  coder: reasoner      # 作成者=Qwen coder → レビュアー=DeepSeek(視点の多様性)
  smart: reasoner
  worker: reasoner
  glimmer: reasoner
  pro: reasoner
  heavy: reasoner
  reasoner: worker
